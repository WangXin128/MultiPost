spring:
  application:
    name: MultiPost
  datasource:
    url: jdbc:h2:mem:multipost;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: multipost
    password: multipost

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

multipost:
  jwt-secret: "change-this-secret-to-a-long-random-value-for-prod"
  jwt-expiration-minutes: 1440
  rabbit:
    enabled: false
  retry:
    max-attempts: 3
