services:
  app:
    build:
      context: .
    container_name: multipost-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MULTIPOST_JWT_SECRET: "replace-this-with-a-long-random-secret"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.4
    container_name: multipost-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multipost
      MYSQL_USER: multipost
      MYSQL_PASSWORD: multipost
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umultipost", "-pmultipost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: multipost-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: multipost-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: multipost
      RABBITMQ_DEFAULT_PASS: multipost
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
